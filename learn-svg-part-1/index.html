<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Learn svg (part-1)</title>
</head>

<body>
  <div class="rows">
    <!-- 1st column -->
    <div class="columns">
      <!-- line -->
      <div class="svg-container">
        <svg>
          <line x1="10" y1="50" x2="200" y2="50" stroke="black" />
        </svg>
      </div>

      <!-- rectangle -->
      <div class="svg-container">
        <svg>
          <rect x="10" y="100" height="50px" width="100px" fill="red" />
        </svg>
      </div>

      <!-- circle -->
      <div class="svg-container">
        <svg>
          <circle cx="150" cy="50" r="30px" fill="blue" />
        </svg>
      </div>

      <!-- ellipse -->
      <div class="svg-container">
        <svg>
          <ellipse cx="150" cy="50" rx="30px" ry="40px" fill="lightgreen" />
        </svg>
      </div>
    </div>

    <!-- 2nd column -->
    <div class="columns">
      <div style="
        width: 101px;
        height: 100px;
        margin: 5px;
        background-size: 10px 10px;
        background-image: linear-gradient(to right, rgb(154, 100, 100) 1px, transparent 1px);
      ">

      </div>
    </div>
  </div>
</body>

</html>
